<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical Lineup Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Tactical Lineup Board</h1>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Formation</h2>
      <select id="formation-select"></select>

      <h2>Substitutes</h2>
      <p>Bench goes here (later)</p>
    </aside>

    <section class="pitch-area">
      <div class="pitch" id="pitch">

        <svg viewBox="0 0 680 1050" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="680" height="1050" class="grass"/>
          <rect x="20" y="20" width="640" height="1010" class="line"/>

          <line x1="20" y1="525" x2="660" y2="525" class="line"/>
          <circle cx="340" cy="525" r="91.5" class="line"/>
          <circle cx="340" cy="525" r="4" class="dot"/>

          <rect x="138.5" y="20" width="403" height="165" class="line"/>  
          <rect x="248.5" y="20" width="183" height="55" class="line"/>    
          <circle cx="340" cy="130" r="4" class="dot"/>                    
          <path d="M 266.9 185 A 91.5 91.5 0 0 0 413.1 185" class="line"/>
          <rect x="303.5" y="4" width="73" height="16" class="goal"/>     

          <rect x="138.5" y="865" width="403" height="165" class="line"/>
          <rect x="248.5" y="975" width="183" height="55" class="line"/>
          <circle cx="340" cy="920" r="4" class="dot"/>
          <path d="M 266.9 865 A 91.5 91.5 0 0 1 413.1 865" class="line"/>
          <rect x="303.5" y="1030" width="73" height="16" class="goal"/>

          <path d="M 20 30 A 10 10 0 0 0 30 20" class="line"/>
          <path d="M 650 20 A 10 10 0 0 0 660 30" class="line"/>
          <path d="M 660 1020 A 10 10 0 0 0 650 1030" class="line"/>
          <path d="M 30 1030 A 10 10 0 0 0 20 1020" class="line"/>
        </svg>
        <div id="tokens"></div>
      </div>
    </section>

  </main>
  <dialog id="player-dialog">
    <form id="player-form">
      <h2>Edit player</h2>

      <label for="player-name">Name</label>
      <input type="text" id="player-name" maxlength="16" placeholder="Player name">

      <label for="player-number">Jersey number (1-99)</label>
      <input type="number" id="player-number" min="1" max="99">

      <label for="player-pos">Position</label>
      <select id="player-pos"></select>

      <p id="player-error" class="error"></p>

      <div class="dialog-buttons">
        <button type="button" id="player-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>
<script src="js/formations.js"></script>
<script src="js/board.js"></script>
</body>
</html>
